name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install the client generator
        run: pip install openapi-python-client==0.29.1
      - name: Generate the Easee cloud client from the OpenAPI specification
        run: python scripts/generate_easee_client.py
      - name: Set the release version in the manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python - "$VERSION" <<'PY'
          import json, sys
          from pathlib import Path
          manifest = Path("custom_components/easee_ocpp/manifest.json")
          data = json.loads(manifest.read_text())
          data["version"] = sys.argv[1]
          manifest.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Package the integration for HACS
        run: |
          cd custom_components/easee_ocpp
          find . -name __pycache__ -prune -exec rm -rf {} +
          zip -r "$GITHUB_WORKSPACE/easee_ocpp.zip" .
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" easee_ocpp.zip --clobber

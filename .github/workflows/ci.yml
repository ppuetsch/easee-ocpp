name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Generate the Easee cloud client from the OpenAPI specification
        run: python scripts/generate_easee_client.py
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy custom_components/easee_ocpp tests scripts
      - name: Tests
        run: pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

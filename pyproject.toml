[project]
name = "easee-ocpp"
version = "0.1.0"
description = "Home Assistant as local OCPP 1.6J server for Easee chargers"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["custom_components/easee_ocpp/easee_cloud_client"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D", "PL", "ASYNC"]
ignore = ["D203", "D213", "PLR0913", "PLR2004", "RUF001", "RUF003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "ASYNC109", "ASYNC110"]
"scripts/*" = ["T201", "D401", "E501", "PLR0917", "RUF002"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
explicit_package_bases = true
exclude = ["easee_cloud_client"]
